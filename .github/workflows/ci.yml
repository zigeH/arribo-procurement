name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arribo
          POSTGRES_PASSWORD: arribo
          POSTGRES_DB: arribo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arribo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://arribo:arribo@localhost:5432/arribo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Bootstrap: go.sum is not committed yet (see issue "Commit go.sum").
      # Once it is, replace this with: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go mod tidy
        run: go mod tidy

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit + workflow + integration tests
        run: go test -race ./...

      - name: evals (persona replay)
        run: go test ./evals -v

      - name: synthetic data up to date
        run: go run ./cmd/gensynth -check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build (no push)
        run: docker build -t arribo:ci .

      - name: smoke test API container
        run: |
          docker run -d --name api -p 8080:8080 arribo:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS localhost:8080/v1/suppliers | head -c 300; echo
          # worker must start and refuse to run without Temporal config
          out=$(docker run --rm arribo:ci /app/worker 2>&1 || true)
          echo "$out" | grep -q TEMPORAL_ADDRESS
          docker logs api
