name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arribo
          POSTGRES_PASSWORD: arribo
          POSTGRES_DB: arribo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arribo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://arribo:arribo@localhost:5432/arribo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: go.mod / go.sum tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      # TEMP (issue #1): print tidy output so go.sum can be committed from CI.
      - name: dump tidy result
        if: failure()
        run: |
          echo "=====GO.MOD====="; cat go.mod
          echo "=====GO.SUM====="; cat go.sum
          echo "=====END====="

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit + workflow + integration tests
        run: go test -race ./...

      - name: evals (persona replay)
        run: go test ./evals -v

      - name: synthetic data up to date
        run: go run ./cmd/gensynth -check
